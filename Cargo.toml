[workspace]
resolver = "2"
members = [
    "crates/shared-data",
    "crates/data-migrate",
    "apps/*/sync-rust",
]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ts-rs = "12"
unicode-normalization = "0.1"
roxmltree = "0.20"
csv = "1"
md5 = "0.8"

# Every crate opts in with `[lints] workspace = true`. `unwrap`/`expect` are
# denied because AGENTS.md wants `anyhow` and `.context(...)` at the failing call.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Every function returns `anyhow::Result` and says what failed in its context.
missing_errors_doc = "allow"
