# ts-rs writes each app's API types into `apps/<app>/web/src/generated/` when
# `cargo test` runs; the `export_to` on each struct is relative to this root.
# i64 is `number`: the values are row ids and counts, far below 2^53, and the
# JSON the pages read has always carried them as numbers.
[env]
TS_RS_EXPORT_DIR = { value = ".", relative = true }
TS_RS_LARGE_INT = "number"
TS_RS_IMPORT_EXTENSION = "ts"
