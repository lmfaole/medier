# The whole repository's checks, run by hand (Actions -> CI -> Run workflow),
# and the dependency review on pull requests that change a dependency.
#
# Building and deploying the Workers is not here: a Worker is deployed by hand
# with `npm run deploy` in its app (docs/DATA.md). Everyday pushes and pull
# requests therefore start nothing here. `.githooks/pre-push` runs lint, typecheck and tests
# before a push, and this workflow is the full set (plus duplication) for when
# a second opinion is wanted. The Rust workspace has its
# own workflow (`rust.yml`).
#
# Actions are pinned to commit SHAs rather than tags, because tags move and a
# moved tag is an unreviewed change to your pipeline.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on a branch is worthless and is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege.
permissions:
  contents: read

jobs:
  apps:
    name: Lint, duplication, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A pull request only needs the dependency review below.
    if: github.event_name != 'pull_request'

    # The same root commands AGENTS.md tells an agent to run before saying a
    # change is done. `npm run check` is left out: its D1 comparison needs the
    # Rust-built local databases, which only the Rust tools build.
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests import .ts files directly, which needs Node's built-in
          # type stripping; the music app already pins the version that has it.
          # No `cache: npm`: the node_modules cache below makes the npm cache
          # a restore that is only used when the lockfile changed.
          node-version-file: apps/music/.nvmrc

      # The installed tree itself, keyed on the lockfile and Node version: a
      # hit skips `npm ci`. No workspace has an install script, so the tree is
      # all `npm ci` would produce.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/web/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('apps/music/.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # TypeScript's incremental state from the last run. Typecheck reuses
      # what did not change, and the deploy's `tsc -b` finds every project it
      # builds already up to date. Restored after the install, which would
      # otherwise delete it with node_modules.
      - name: Restore TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.tmp
            apps/*/web/node_modules/.tmp
            packages/*/node_modules/.tmp
          key: tsc-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ hashFiles('package-lock.json') }}-

      # The skills an agent follows are the design system's of the pinned version; a bump that leaves them behind is caught here.
      - name: Design system skills are up to date
        run: npm run skills:check

      - name: Lint
        run: npm run lint

      # The threshold in .jscpd.json is today's figure, lowered as copies move
      # into packages/* and crates/shared-data; it may only go down.
      - name: Duplication
        run: npm run dupes

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: No devtools in a production bundle
        run: npm run check:bundles

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    # Catches a dependency that changed its install script, which is the shape
    # most supply chain incidents take.
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
