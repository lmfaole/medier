name: Image

# The media server as an image, `ghcr.io/lmfaole/medier`, built after CI has passed on main, tagged `latest` and with the commit. The machine
# pulls `latest` with `podman auto-update` (`deploy/media.container`), so a green push to main is a deploy without anyone logging in there.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out the commit CI passed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to the GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          sha="$(git rev-parse HEAD)"
          docker build --file Containerfile \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$sha" \
            --tag "ghcr.io/lmfaole/medier:$sha" --tag ghcr.io/lmfaole/medier:latest .

      - name: Check that the server starts
        run: |
          docker run --detach --name smoke --env MEDIA_LOGIN=off --publish 3000:3000 ghcr.io/lmfaole/medier:latest
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/healthz >/dev/null; then echo "up"; docker rm --force smoke; exit 0; fi
            sleep 1
          done
          docker logs smoke; exit 1

      - name: Push
        run: |
          docker push "ghcr.io/lmfaole/medier:$(git rev-parse HEAD)"
          docker push ghcr.io/lmfaole/medier:latest
