name: Site

# Every push is tested, type-checked and built; a push to main, or a manual run, is also deployed to Cloudflare Workers: the site (medier.lmfaole.party) and the relay
# it asks its sources through (`upstream/`). The site asks Last.fm, Trakt, TMDB and Spotify when a page is asked for, so nothing is fetched here. The sources' keys are
# secrets of the Worker (`npm run settings:push`); only the two Cloudflare secrets are this repository's.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run skills:check
      - run: npm run build

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set as a repository secret, so this run only builds."
            exit 0
          fi
          npx wrangler deploy --config upstream/wrangler.jsonc
          npx wrangler deploy
