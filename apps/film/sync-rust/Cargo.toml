[package]
name = "film-sync"
version = "0.1.0"
edition = "2021"
description = "Imports the owner's hand-written film log and fetches what the film register TMDB says about each film, into the local database"

[[bin]]
name = "film-sync"
path = "src/main.rs"

[dependencies]
shared-data = { path = "../../../crates/shared-data", features = ["local-sqlite"] }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }

[lints]
workspace = true
