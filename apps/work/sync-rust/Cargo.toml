[package]
name = "work-sync"
version = "0.1.0"
edition = "2021"
description = "Keeps the owner's GitHub repositories, pull requests, issues and contributions in the local database"

[[bin]]
name = "work-sync"
path = "src/main.rs"

[dependencies]
shared-data = { path = "../../../crates/shared-data", features = ["local-sqlite"] }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
