[package]
name = "music-sync"
version = "0.1.0"
edition = "2021"
description = "Fetches ListenBrainz listens and recomputes wrapped-style stats into the local database"

[[bin]]
name = "music-sync"
path = "src/main.rs"

[dependencies]
shared-data = { path = "../../../crates/shared-data", features = ["local-sqlite"] }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
unicode-normalization = { workspace = true }
roxmltree = { workspace = true }
csv = { workspace = true }
md5 = { workspace = true }

[dev-dependencies]
# Already in the workspace for the data-rust tools; here only so the
# aggregation SQL is tested against real SQLite, which is what D1 runs.
rusqlite = { workspace = true }

[lints]
workspace = true
