[package]
name = "data-migrate"
version = "0.1.0"
edition = "2021"
description = "Brings every local database under .data/ to its latest migration"

[[bin]]
name = "data-migrate"
path = "src/main.rs"

[dependencies]
shared-data = { path = "../shared-data", features = ["local-sqlite"] }
anyhow = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
